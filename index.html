<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>The Lesson Book</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style id="sheet">
:root{
  --f-disp:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --bg:#f4f2ee; --panel:#ffffff; --panel-2:#faf8f4;
  --ink:#211f1b; --muted:#6c675e; --faint:#9a9488;
  --line:#e4e0d8; --line-2:#efece5;
  --accent:#211f1b; --accent-ink:#faf8f4;
  --focus:#2f6db0;
  --today:#fff6e6;
  --shadow:0 1px 2px rgba(33,31,27,.05),0 10px 34px rgba(33,31,27,.09);
  --piano:#2f6db0; --piano-bg:#e9f1f8; --piano-ink:#1c4c81;
  --guitar:#bd6b1a; --guitar-bg:#f6ecdd; --guitar-ink:#7e4711;
  --voice:#be3a6e; --voice-bg:#f9e7ef; --voice-ink:#8a2650;
  --ukulele:#2e9e6b; --ukulele-bg:#e3f3ec; --ukulele-ink:#1c6b47;
  --drums:#6c4bd0; --drums-bg:#ece7f9; --drums-ink:#4a2f9e;
  --st-progress:#0f9b8e; --st-unpaid:#c99a1d; --st-paid:#2e9e6b; --st-cancel:#c0392b; --st-resched:#8b5cf6;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#151311; --panel:#1f1c19; --panel-2:#26221e;
    --ink:#f2efe8; --muted:#a9a298; --faint:#7c7568;
    --line:#332f2a; --line-2:#2b2823;
    --accent:#f2efe8; --accent-ink:#1a1815;
    --focus:#6db3e0;
    --today:#2c2517;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 34px rgba(0,0,0,.4);
    --piano:#6fb2e2; --piano-bg:#152c3c; --piano-ink:#c3e1f5;
    --guitar:#e0a05a; --guitar-bg:#382613; --guitar-ink:#f3d5ac;
    --voice:#e07aa6; --voice-bg:#3a1c2b; --voice-ink:#f6cbdd;
    --ukulele:#5fc79a; --ukulele-bg:#123527; --ukulele-ink:#c0ecd7;
    --drums:#a68ce8; --drums-bg:#241a3f; --drums-ink:#dacdf6;
    --st-progress:#4cc2b6; --st-unpaid:#e0bc55; --st-paid:#5fc79a; --st-cancel:#e2726a; --st-resched:#b39bf0;
  }
}
:root[data-theme="dark"]{
  --bg:#151311; --panel:#1f1c19; --panel-2:#26221e;
  --ink:#f2efe8; --muted:#a9a298; --faint:#7c7568;
  --line:#332f2a; --line-2:#2b2823;
  --accent:#f2efe8; --accent-ink:#1a1815;
  --focus:#6db3e0;
  --today:#2c2517;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 34px rgba(0,0,0,.4);
  --piano:#6fb2e2; --piano-bg:#152c3c; --piano-ink:#c3e1f5;
  --guitar:#e0a05a; --guitar-bg:#382613; --guitar-ink:#f3d5ac;
  --voice:#e07aa6; --voice-bg:#3a1c2b; --voice-ink:#f6cbdd;
  --ukulele:#5fc79a; --ukulele-bg:#123527; --ukulele-ink:#c0ecd7;
  --drums:#a68ce8; --drums-bg:#241a3f; --drums-ink:#dacdf6;
  --st-progress:#4cc2b6; --st-unpaid:#e0bc55; --st-paid:#5fc79a; --st-cancel:#e2726a; --st-resched:#b39bf0;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:var(--f-body); font-size:14px; line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--focus); outline-offset:2px; border-radius:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.wrap{max-width:1180px; margin:0 auto; padding:22px 22px 60px}

.hd{display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap; margin-bottom:16px}
.brand h1{font-family:var(--f-disp); font-weight:700; font-size:23px; letter-spacing:-.02em; margin:0; text-wrap:balance}
.brand p{margin:3px 0 0; font-family:var(--f-mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.09em; color:var(--muted)}
.hd-actions{display:flex; gap:8px; flex-wrap:wrap}

.btn{font-size:13px; padding:8px 12px; border-radius:9px; border:1px solid var(--line); background:var(--panel); color:var(--ink); cursor:pointer; line-height:1; white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.btn.primary:hover{opacity:.9}
.btn.icon{padding:8px 10px; font-size:15px}
.btn.ghost{border-color:transparent; background:transparent; color:var(--muted)}
.btn.ghost:hover{background:var(--panel-2); border-color:transparent}
.btn.danger{color:var(--voice); border-color:transparent; background:transparent}
.btn.danger:hover{background:var(--voice-bg); border-color:transparent}

.help{display:flex; gap:10px; align-items:center; flex-wrap:wrap; background:var(--panel-2); border:1px solid var(--line); border-radius:11px; padding:9px 12px; font-size:12.5px; color:var(--muted); margin-bottom:14px}
.help b{color:var(--ink); font-weight:600}
.help .spacer{flex:1}
.linkish{background:none; border:0; color:var(--focus); cursor:pointer; font-size:12.5px; padding:2px 4px; text-decoration:underline}

.bar{display:flex; flex-wrap:wrap; gap:12px 14px; align-items:center; justify-content:space-between; margin-bottom:14px}
.seg{display:inline-flex; border:1px solid var(--line); border-radius:9px; overflow:hidden}
.seg button{font-size:13px; padding:7px 15px; border:0; background:var(--panel); color:var(--muted); cursor:pointer}
.seg button[aria-selected="true"]{background:var(--accent); color:var(--accent-ink)}
.nav{display:flex; align-items:center; gap:4px}
.nav strong{font-family:var(--f-disp); font-weight:600; font-size:15px; min-width:150px; text-align:center}
.nav .arw{font-size:16px; padding:6px 10px}
.wk-cap{font-family:var(--f-mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.09em; color:var(--faint)}

.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip{display:inline-flex; align-items:center; gap:6px; font-size:12.5px; padding:5px 11px; border-radius:999px; border:1px solid var(--line); background:var(--panel); color:var(--ink); cursor:pointer}
.chip .dot{width:8px; height:8px; border-radius:50%; background:var(--c,var(--faint)); flex:none}
.chip[aria-pressed="true"]{background:var(--cb,var(--panel-2)); border-color:var(--c,var(--muted)); color:var(--ci,var(--ink)); font-weight:600}
.chip.all[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.chip.all .dot{background:currentColor}

.scroll{overflow-x:auto; border:1px solid var(--line); border-radius:14px; background:var(--panel)}

/* ---- week ---- */
.wk{min-width:760px}
.wk-head{display:grid; grid-template-columns:58px repeat(7,1fr); position:sticky; top:0; z-index:3; background:var(--panel); border-bottom:1px solid var(--line)}
.wk-head .cnr{border-right:1px solid var(--line)}
.wk-dh{padding:10px 8px; font-family:var(--f-mono); font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); border-right:1px solid var(--line)}
.wk-dh:last-child{border-right:0}
.wk-body{display:grid; grid-template-columns:58px repeat(7,1fr); position:relative}
.gutter{position:relative; border-right:1px solid var(--line)}
.gutter .hl{position:absolute; right:6px; transform:translateY(-6px); font-family:var(--f-mono); font-size:10px; color:var(--faint)}
.daycol{position:relative; border-right:1px solid var(--line); cursor:copy;
  background-image:
    repeating-linear-gradient(to bottom, var(--line) 0 1px, transparent 1px var(--hour,48px)),
    repeating-linear-gradient(to bottom, transparent 0 calc(var(--hour,48px)/2), var(--line-2) calc(var(--hour,48px)/2) calc(var(--hour,48px)/2 + 1px), transparent calc(var(--hour,48px)/2 + 1px) var(--hour,48px));
}
.daycol:last-child{border-right:0}
.ev{position:absolute; left:0; right:0; margin:0 2px; padding:3px 6px; border:0; border-left:3px solid var(--c); border-radius:6px;
  background:var(--cb); color:var(--ci); text-align:left; cursor:pointer; overflow:hidden; display:flex; flex-direction:column; gap:1px}
.ev:hover{filter:brightness(.97); box-shadow:inset 0 0 0 1px var(--c)}
.ev.short{flex-direction:row; align-items:baseline; gap:5px}
.ev .ev-t{font-family:var(--f-mono); font-size:10px; font-weight:500; opacity:.85; flex:none}
.ev .ev-s{font-size:11.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.ev .ev-n{font-size:10px; opacity:.8; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}

/* ---- month ---- */
.mo{min-width:760px}
.mo-head{display:grid; grid-template-columns:repeat(7,1fr); border-bottom:1px solid var(--line)}
.mo-head div{padding:8px 10px; font-family:var(--f-mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); border-right:1px solid var(--line)}
.mo-head div:last-child{border-right:0}
.mo-grid{display:grid; grid-template-columns:repeat(7,1fr); grid-auto-rows:minmax(96px,1fr)}
.mo-cell{border-right:1px solid var(--line); border-bottom:1px solid var(--line); padding:5px 6px 7px; display:flex; flex-direction:column; gap:3px; cursor:pointer; min-width:0}
.mo-cell:nth-child(7n){border-right:0}
.mo-cell.out{background:var(--panel-2)}
.mo-cell.out .mo-d{color:var(--faint)}
.mo-cell.today{box-shadow:inset 0 0 0 2px var(--focus)}
.mo-d{font-family:var(--f-mono); font-size:11px; color:var(--muted); align-self:flex-end}
.mo-cell.today .mo-d{color:var(--focus); font-weight:600}
.pill{display:flex; align-items:center; gap:5px; width:100%; border:0; border-radius:5px; padding:2px 5px; background:var(--cb); color:var(--ci); font-size:10.5px; cursor:pointer; white-space:nowrap; overflow:hidden}
.pill .pdot{width:6px; height:6px; border-radius:50%; background:var(--c); flex:none}
.pill .pt{font-family:var(--f-mono); font-weight:500; flex:none}
.pill .ps{overflow:hidden; text-overflow:ellipsis}
.pill .sdot{width:6px; height:6px; border-radius:50%; background:var(--sc); flex:none; margin-left:auto}
.pill.strike .ps{text-decoration:line-through; opacity:.6}
.daylist button.strike{opacity:.6}
.daylist button.strike .pt,.daylist button.strike span:not(.tag):not(.swatch){text-decoration:line-through}
.stbadge{display:inline-flex; align-items:center; gap:5px; font-size:11px; padding:3px 8px; border-radius:999px; background:var(--panel-2); border:1px solid var(--line)}
.stbadge .sdot{width:7px; height:7px; border-radius:50%; background:var(--sc,var(--faint))}
.stpick{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px}
.stpick button{display:inline-flex; align-items:center; gap:6px; font-size:12px; padding:6px 10px; border-radius:999px; border:1px solid var(--line); background:var(--panel); color:var(--ink); cursor:pointer}
.stpick button .sdot{width:7px; height:7px; border-radius:50%; background:var(--sc,var(--faint)); flex:none}
.stpick button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.stpick button[aria-pressed="true"] .sdot{outline:2px solid var(--accent-ink); outline-offset:1px}
.bmini{border:1px solid var(--line); border-radius:11px; background:var(--panel-2); padding:11px 12px; margin-bottom:14px}
.bmini .r{display:flex; justify-content:space-between; font-size:12.5px; padding:2px 0}
.bmini .acts{display:flex; gap:8px; margin-top:9px; flex-wrap:wrap}
.linklist{max-height:160px; overflow:auto; border:1px solid var(--line); border-radius:9px; margin:8px 0}
.linklist button{display:block; width:100%; text-align:left; border:0; border-bottom:1px solid var(--line-2); background:var(--panel); color:var(--ink); padding:7px 10px; font-size:12.5px; cursor:pointer}
.linklist button:last-child{border-bottom:0}
.linklist button:hover{background:var(--panel-2)}
.invoice{font-family:var(--f-body)}
.invoice .ihead{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:18px}
.invoice .ihead h2{margin:0 0 3px}
.invoice .idoc{font-family:var(--f-mono); font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); text-align:right}
.invoice .idoc b{display:block; font-size:16px; letter-spacing:0; color:var(--ink); font-family:var(--f-disp)}
.invoice table{width:100%; border-collapse:collapse; margin:10px 0 16px; font-size:13px}
.invoice th{text-align:left; font-family:var(--f-mono); font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:500; padding:6px 0; border-bottom:1px solid var(--line)}
.invoice td{padding:8px 0; border-bottom:1px solid var(--line-2)}
.invoice td.num,.invoice th.num{text-align:right; font-variant-numeric:tabular-nums; font-family:var(--f-mono)}
.modal:has(.repgrid){width:min(640px,100%)}
.repgrid{display:grid; gap:16px; margin-bottom:6px}
.reptbl{width:100%; border-collapse:collapse; font-size:12.5px; margin-top:8px}
.reptbl th{text-align:left; font-family:var(--f-mono); font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:500; padding:6px 8px; border-bottom:1px solid var(--line)}
.reptbl td{padding:6px 8px; border-bottom:1px solid var(--line-2)}
.reptbl td.num,.reptbl th.num{text-align:right; font-variant-numeric:tabular-nums; font-family:var(--f-mono)}
.rephead{font-family:var(--f-mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:16px 0 4px}
.rephead:first-child{margin-top:0}
.more{border:0; background:none; color:var(--muted); font-size:10.5px; cursor:pointer; text-align:left; padding:1px 5px}
.more:hover{color:var(--ink)}

.empty{padding:46px 24px; text-align:center; color:var(--muted)}
.empty h3{font-family:var(--f-disp); font-weight:600; color:var(--ink); margin:0 0 6px}

/* ---- modal ---- */
.overlay{position:fixed; inset:0; background:rgba(15,13,10,.46); display:grid; place-items:center; padding:16px; z-index:50}
.modal{background:var(--panel); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); width:min(440px,100%); max-height:90vh; overflow:auto; padding:20px}
.modal h2{font-family:var(--f-disp); font-weight:600; font-size:18px; margin:0 0 16px}
.fld{display:flex; flex-direction:column; gap:5px; margin-bottom:13px}
.fld label{font-family:var(--f-mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted)}
.fld input,.fld select,.fld textarea{font-family:inherit; font-size:14px; padding:9px 10px; border:1px solid var(--line); border-radius:9px; background:var(--panel-2); color:var(--ink); width:100%}
.fld textarea{resize:vertical; min-height:56px}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.rep{display:inline-flex; border:1px solid var(--line); border-radius:9px; overflow:hidden}
.rep button{font-size:13px; padding:8px 14px; border:0; background:var(--panel-2); color:var(--muted); cursor:pointer; flex:1}
.rep button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink)}
.m-act{display:flex; gap:8px; align-items:center; margin-top:18px}
.m-act .grow{flex:1}
.err{color:var(--voice); font-size:12px; margin:-6px 0 10px}
.daylist{display:flex; flex-direction:column; gap:6px; margin-bottom:14px}
.daylist button{display:flex; align-items:center; gap:8px; width:100%; text-align:left; border:1px solid var(--line); border-radius:9px; padding:8px 10px; background:var(--panel-2); color:var(--ink); cursor:pointer; font-size:13px}
.daylist button:hover{border-color:var(--muted)}
.daylist .pt{font-family:var(--f-mono); font-size:12px; color:var(--muted); flex:none}
.daylist .tag{font-family:var(--f-mono); font-size:10px; text-transform:uppercase; letter-spacing:.05em; margin-left:auto; color:var(--muted)}
.swatch{width:10px; height:10px; border-radius:50%; flex:none}
.hint{font-size:12px; color:var(--muted); margin:8px 0 0}

/* ---- billing ---- */
.bill-actions{display:flex; gap:8px; flex-wrap:wrap}
.bfilter{display:flex; gap:6px; flex-wrap:wrap; align-items:center}
.bfilter select{font-family:var(--f-body); font-size:12px; padding:5px 8px; border:1px solid var(--line); border-radius:8px; background:var(--panel); color:var(--ink)}
.chip.sf{text-transform:capitalize}
.chip.sf[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:600}
.stats{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:14px}
.stat{border:1px solid var(--line); border-radius:12px; background:var(--panel); padding:12px 14px}
.stat .k{font-family:var(--f-mono); font-size:10px; text-transform:uppercase; letter-spacing:.07em; color:var(--muted)}
.stat .v{font-family:var(--f-disp); font-weight:600; font-size:20px; margin-top:3px; font-variant-numeric:tabular-nums}
.stat.out .v{color:var(--voice)}
.stat.coll .v{color:var(--ukulele)}
.tbl-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:14px; background:var(--panel)}
.tbl{width:100%; border-collapse:collapse; min-width:860px; font-size:12.5px}
.tbl th{text-align:left; font-family:var(--f-mono); font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:500; padding:10px 12px; border-bottom:1px solid var(--line); white-space:nowrap}
.tbl td{padding:9px 12px; border-bottom:1px solid var(--line-2); white-space:nowrap; vertical-align:middle}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tbody tr:hover{background:var(--panel-2)}
.tbl .num{text-align:right; font-variant-numeric:tabular-nums; font-family:var(--f-mono)}
.tbl .stu{font-weight:600; color:var(--ink)}
.tbl .dt{font-family:var(--f-mono); color:var(--muted)}
.lz{display:inline-flex; align-items:center; gap:6px}
.lz .dot{width:8px; height:8px; border-radius:50%; background:var(--c,var(--faint)); flex:none}
.badge{display:inline-block; font-family:var(--f-mono); font-size:9px; text-transform:uppercase; letter-spacing:.04em; padding:2px 6px; border-radius:5px; border:1px solid var(--line); color:var(--muted); margin-left:5px; vertical-align:middle}
.badge.pack{color:var(--piano-ink); background:var(--piano-bg); border-color:transparent}
.pill-s{display:inline-block; font-family:var(--f-mono); font-size:10px; text-transform:uppercase; letter-spacing:.04em; padding:3px 8px; border-radius:999px; font-weight:500}
.pill-s.unpaid{background:var(--voice-bg); color:var(--voice-ink)}
.pill-s.partial{background:var(--guitar-bg); color:var(--guitar-ink)}
.pill-s.paid{background:var(--ukulele-bg); color:var(--ukulele-ink)}
.mini{background:var(--panel-2); border:1px solid var(--line); border-radius:7px; padding:4px 8px; font-size:11px; cursor:pointer; color:var(--ink)}
.mini:hover{border-color:var(--muted)}
.calc{background:var(--panel-2); border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin:2px 0 13px; font-size:13px}
.calc .r{display:flex; justify-content:space-between; gap:12px; padding:2px 0}
.calc .r span:last-child{font-variant-numeric:tabular-nums; font-family:var(--f-mono)}
.calc .r.tot{border-top:1px solid var(--line); margin-top:5px; padding-top:6px; font-weight:600; font-family:var(--f-disp)}
.calc .r.bal{color:var(--muted)}
.rategrid{display:grid; grid-template-columns:1fr auto auto; gap:8px 10px; align-items:center}
.rategrid .h{font-family:var(--f-mono); font-size:9.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); text-align:right}
.rategrid .h:first-child{text-align:left}
.rategrid input{width:88px; font-family:inherit; font-size:13px; padding:7px 8px; border:1px solid var(--line); border-radius:8px; background:var(--panel-2); color:var(--ink); text-align:right}
.rategrid .lbl{display:flex; align-items:center; gap:7px; font-size:13px}
.pkg{background:var(--panel-2); border:1px solid var(--line); border-radius:10px; padding:10px; margin-bottom:8px; display:flex; flex-direction:column; gap:7px}
.pkg input[type="text"],.pkg input[type="number"],.pkg select{font-family:inherit; font-size:13px; padding:7px 8px; border:1px solid var(--line); border-radius:8px; background:var(--panel); color:var(--ink); width:100%}
.pkg .ck{display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--ink)}
.pkg .ck input{width:auto}
.ckline{display:flex; align-items:center; gap:7px; font-size:13px; color:var(--ink); margin-bottom:13px}
.ckline input{width:auto}

@media (max-width:640px){
  .wrap{padding:16px 12px 48px}
  .bar{gap:10px}
  .nav strong{min-width:120px; font-size:14px}
  .stats{grid-template-columns:1fr}
}
@media print{
  :root{--bg:#fff;--panel:#fff;--panel-2:#fff;--ink:#000;--muted:#333;--line:#bbb;--line-2:#ddd}
  .hd-actions,.help,.bar .seg,.bar .nav .arw,.bar .nav .today-btn,.bar .bill-actions,.bfilter,.more,.mini,.tbl th:last-child,.tbl td:last-child{display:none!important}
  .wrap{max-width:none;padding:0}
  .scroll,.tbl-wrap{border:0}
  .ev,.pill,.pill-s,.badge{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body.printing-doc .wrap{display:none}
  body.printing-doc .overlay{position:static;background:none;padding:0}
  body.printing-doc .modal{box-shadow:none;border:0;width:100%;max-width:none;max-height:none;padding:0}
  body.printing-doc .modal .noprint{display:none!important}
}
</style>
